name: Publish image to GHCR

# Fork-local publishing path that uses GITHUB_TOKEN to push to
# ghcr.io/<owner>/webprotege-gwt-api-gateway, independent of the upstream
# Docker Hub credentials.  Coexists with the existing release.yaml (which
# requires upstream's bot/Docker Hub secrets).
#
# Triggers:
#   * push to main           -> tag :latest + :sha-<short>   + :<pom version>
#   * push of a git tag      -> tag :<tag value>
#   * workflow_dispatch      -> tag :<sanitized branch>-<short sha> + :sha-<short>
#                               (lets feature branches publish a one-off image
#                                for validation against webprotege-deploy)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build jar
        # Skip tests here: integration tests require a working Docker
        # environment for Testcontainers, and the project's CI workflow
        # already runs full tests on every push.  This workflow's job is
        # to produce + publish the image.
        run: mvn --batch-mode -DskipTests package

      - name: Read POM version
        id: pom-version
        run: |
          v=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/webprotege-gwt-api-gateway
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.pom-version.outputs.version }},enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_name != 'main' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
