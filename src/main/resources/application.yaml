server:
  port: 7777

logging:
  level:
    org:
      springframework:
        amqp: ERROR
spring:
  application:
    name: webprotege-gwt-api-gateway
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB


webprotege:
  rabbitmq:
    requestqueue: webprotege-gwt-api-gateway-queue
    responsequeue: webprotege-gwt-api-gateway-response-queue
    eventsqueue: webprotege-gwt-api-gateway-event-queue
    timeout: 120000
    event-subscribe: true
  # allowedOrigin: must be supplied by the deployment (env: WEBPROTEGE_ALLOWEDORIGIN)
  minio:
    accessKey: webprotege
    # endPoint: must be supplied by the deployment (env: webprotege.minio.endPoint)
    secretKey: webprotege
    bucketName: webprotege-uploads


spring.security.oauth2:
  client:
    registration.keycloak:
      client-id: webprotege
      authorization-grant-type: authorization_code
      scope: openid
    provider.keycloak:
      # issuer-uri: must be supplied by the deployment
      #   (env: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI).
      # Alternatively, omit issuer-uri and provide token-uri / jwk-set-uri /
      # user-info-uri explicitly to skip the boot-time discovery doc fetch.
      user-name-attribute: preferred_username
  # resourceserver.jwt.issuer-uri (or jwk-set-uri) must be supplied by the deployment
  # (env: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI).